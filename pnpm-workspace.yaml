packages:
  - client
  - server

# pnpm 12 gates dependency lifecycle scripts behind an explicit allow-list.
allowBuilds:
  "@biomejs/biome": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

# pnpm 12 refuses packages published within `minimumReleaseAge` (24h by
# default). The stack is pinned exactly, so these versions are exempt rather
# than silently downgraded.
minimumReleaseAgeExclude:
  - vite@8.3.5
  - "@biomejs/*"
  - react-router@8.5.1

permissions:
  "@trpc/client":
    skills: true
  "@trpc/server":
    skills: true
  "@trpc/tanstack-react-query":
    skills: true
